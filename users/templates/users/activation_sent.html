{% extends "users/base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Activation Email Sent</h2>
    <p>
        An activation link has been sent to <strong>{{ email }}</strong>.<br>
        Please check your inbox and click the link to activate your account.
    </p>

    <p>If you didn't receive the email, <a href="{% url 'resend_activation' %}">click here to resend it</a>.</p>
</div>
{% endblock %}
